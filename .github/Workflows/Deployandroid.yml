name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Descompactar projeto
        run: unzip -q CalcOverlay.zip -d project

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permissão ao Gradle
        working-directory: project
        run: chmod +x gradlew

      - name: Compilar APK
        working-directory: project
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CalcOverlay-APK
          path: 'project/**/build/outputs/apk/debug/*.apk'
